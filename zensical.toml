[project]
site_url = "https://hpc-bigdata-fosdem.github.io"
site_name = "HPC, Big Data & Data Science devroom at FOSDEM"
repo_url = "https://github.com/hpc-bigdata-fosdem/hpc-bigdata-fosdem.github.io"

nav = [
  { "HPC, Big Data & Data Science devroom at FOSDEM" = "index.md" },
  { "Archive" = "archive.md" },
]

[project.extra]
generator = false

[project.plugins.search]
enabled = false

[project.theme]
language = "en"
font.text = "Google Sans Code"
features = [
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
]

[project.theme.icon]
logo = "lucide/server-cog"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.superfences = {}
